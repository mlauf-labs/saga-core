# Saga main configuration.
# Secrets MUST be provided via environment variables using ${ENV_VAR} syntax.
# See .env.example for the list of required variables.

app:
  name: ${SAGA_STORE_NAME:-saga}
  environment: ${SAGA_ENV:-development}

api:
  host: 0.0.0.0
  port: 8000
  # Toggle the interactive Swagger UI (FR-34 / NFR-29).
  enable_swagger: true
  # Maximum upload size in bytes (NFR-20).
  max_upload_bytes: 104857600 # 100 MiB
  # CORS for browser UIs. Comma-separated origins; '*' allows all (default).
  cors_allow_origins: ${API_CORS_ALLOW_ORIGINS:-*}
  cors_allow_credentials: ${API_CORS_ALLOW_CREDENTIALS:-true}
  pagination:
    default_page_size: 25
    max_page_size: 200

mcp:
  host: 0.0.0.0
  port: 8100
  transport: streamable-http
  # Bounded result size for performant search (NFR-10).
  default_top_k: 10
  max_top_k: 50

security:
  # Bearer token(s) for REST + MCP. Comma-separated list resolved from env.
  bearer_tokens: ${SAGA_API_TOKENS}

opensearch:
  hosts: ${OPENSEARCH_HOSTS:-http://opensearch:9200}
  username: ${OPENSEARCH_USERNAME:-admin}
  password: ${OPENSEARCH_PASSWORD}
  verify_certs: false
  document_index: ${SAGA_STORE_NAME:-saga}-documents
  chunk_index: ${SAGA_STORE_NAME:-saga}-document_chunks
  hybrid_pipeline: ${SAGA_STORE_NAME:-saga}-hybrid
  # Must match the active embedding model (FR-27). Changing requires reindex.
  vector_dimension: 768
  vector_space_type: cosinesimil
  vector_engine: faiss
  knn_ef_construction: 256
  knn_m: 16
  # Reciprocal Rank Fusion constant for combining keyword + semantic rankings (FR-19).
  rrf_k: 60

postgres:
  # Relational system of record for documents, folders, doc-types, notes, membership.
  dsn: ${POSTGRES_DSN:-postgresql+asyncpg://saga:saga@postgres:5432/saga}
  pool_size: 10
  max_overflow: 20
  echo: false

minio:
  endpoint: ${MINIO_ENDPOINT:-minio:9000}
  access_key: ${MINIO_ACCESS_KEY}
  secret_key: ${MINIO_SECRET_KEY}
  secure: false
  bucket: ${SAGA_STORE_NAME:-saga}-originals

redis:
  url: ${REDIS_URL:-redis://redis:6379/0}

chunking:
  # Maximum chunk size in tokens (FR-6, configurable).
  max_tokens: 512
  overlap_tokens: 64
  # Tokenizer used for token-based splitting fallback.
  tokenizer: cl100k_base

dedup:
  # reject | replace | allow (FR-13)
  on_duplicate: replace
  # On update: keep | new (FR-11)
  document_id_on_update: keep

similarity:
  # Ingestion-time document similarity used to suggest a folder (FR-16).
  candidate_pool: 50
  top_k: 10
  weight_semantic: 0.6
  weight_lexical: 0.15
  weight_doc_type: 0.1
  weight_values: 0.15
  primary_folder_boost: 1.5
  ancestor_credit: 0.3
  max_folder_votes: 5

timeline:
  # Number of top related documents included in event rationale.
  rationale_top_n: 5
  # Default and maximum page sizes for timeline list endpoints.
  default_page_size: 50
  max_page_size: 500
  # Minimum confidence for an extracted content/timeline event to be kept.
  content_min_confidence: 0.5
  # Default horizon (days) for recurrence expansion / the agenda view.
  recurrence_horizon_days: 366
  # Per-rule cap on expanded occurrences (guards against pathological RRULEs).
  max_occurrences_per_rule: 366

export:
  # Public base URL for resolvable OKF `resource` links; null → saga:// fallback.
  public_base_url: null

generation:
  # Natural language used for LLM-generated content: summaries, folder names/descriptions,
  # doc-type descriptions, and folder-placement rationale.  Use a full name understood by
  # the active LLM model (e.g. "German", "French", "Spanish").
  # Default: "English".
  # Exception: extracted metadata keys/values (value-extraction step) are ALWAYS in English.
  language: ${SAGA_LANGUAGE:-English}
  # Optional free-text description of this archive's purpose. Injected into LLM prompts to
  # guide folder names, doc-type labels, and descriptions toward the archive's actual use
  # case (e.g. family archive, HR department, project archive).  Leave empty to use
  # generic LLM behaviour.  See .env.example for recommended description guidelines.
  description: ${SAGA_STORE_DESCRIPTION:-}

langfuse:
  # Leave public_key / secret_key empty to disable Langfuse tracing entirely.
  # Keys are found in Langfuse UI → Settings → API Keys.
  public_key: ${LANGFUSE_PUBLIC_KEY:-}
  secret_key: ${LANGFUSE_SECRET_KEY:-}
  # EU cloud: https://cloud.langfuse.com | US: https://us.cloud.langfuse.com
  # Self-hosted: http://your-host:3000
  host: ${LANGFUSE_HOST:-https://cloud.langfuse.com}

metrics:
  enabled: true
  worker_port: 9000
  stuck_threshold_seconds: 3600
  prices: {}   # e.g. {"gpt-4o-mini": {prompt_per_1k: 0.15, completion_per_1k: 0.6}}

logging:
  config_file: config/logging.yaml
