# Structured, coloured console logging (NFR-16).
# `renderer: console` -> human-readable + coloured (dev).
# `renderer: json`    -> structured JSON lines (prod).

level: ${LOG_LEVEL:-INFO}
renderer: ${LOG_RENDERER:-console}
# Include the job/correlation id in every record where available.
include_correlation_id: true

categories:
  saga.api: INFO
  saga.mcp: INFO
  saga.pipeline: INFO
  saga.storage: INFO
  saga.llm: INFO
  saga.converters: INFO
  # Third-party noise reduction.
  opensearch: WARNING
  httpx: WARNING
  uvicorn.access: WARNING
