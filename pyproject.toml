[project]
name = "docstore"
version = "1.0.0"
description = "A document store for RAG agents: ingest, convert, enrich, index, and hybrid-search any document."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DocStore contributors" }]
keywords = ["rag", "documents", "opensearch", "mcp", "docling", "kreuzberg", "vector-search"]

# NOTE: floors are conservative; `uv lock` pins the latest compatible versions.
# Keep dependencies current (NFR-4).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "opensearch-py[async]>=2.7",
    "minio>=7.2",
    "arq>=0.26",
    "redis>=5.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "langchain-text-splitters>=0.3",
    "mcp>=1.2",
    "openai>=1.50",
    "ollama>=0.4",
]

[project.optional-dependencies]
# Convenience extra; real provider selection happens via config (FR-33).
azure = ["openai>=1.50"]

[project.scripts]
docstore-api = "docstore.api.__main__:main"
docstore-worker = "docstore.pipeline.__main__:main"
docstore-mcp = "docstore.mcp.__main__:main"
docstore-backup = "docstore.scripts.backup:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstore"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TC", "RUF", "ANN", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "TC"]
# The backup script is a sequential CLI tool; blocking filesystem IO is intentional.
"src/docstore/scripts/backup.py" = ["ASYNC240"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at runtime, so don't push their imports into
# TYPE_CHECKING blocks (would break model schema building).
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
show_error_codes = true
files = ["src", "tests"]

# Third-party libraries that don't ship type information.
[[tool.mypy.overrides]]
module = ["opensearchpy.*", "minio.*", "arq.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=docstore --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["docstore"]
# Modules below are typed placeholders implemented in later phases (see
# docs/planning/implementation-plan.md). Remove each entry when its phase lands so
# the >=80% gate (NFR-23) applies to the new code.
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
