# Saga full stack (NFR-6). Brings up every component.
#
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up -d
#
# Image tags use `latest` to follow the "newest versions" requirement (NFR-4).
# For reproducible production deploys, pin images in a docker-compose.prod.yml
# override (NFR-35) — see docs/operations.md ("Image pinning").

name: saga

# Prompt instruction files are mounted read-only from the local config/prompts/
# directory so operators can customise LLM behaviour without rebuilding the image.
# Edit the files under config/prompts/ and restart the affected service to apply
# changes.  When running the image directly (docker run, no compose), the files
# baked into the image at /app/config/prompts/ are used as the default.
in: &prompts-mount
  - ./config/prompts:/app/config/prompts:ro

x-app-env: &app-env
  SAGA_STORE_NAME: ${SAGA_STORE_NAME:-saga}
  SAGA_STORE_DESCRIPTION: ${SAGA_STORE_DESCRIPTION:-}
  SAGA_ENV: ${SAGA_ENV:-development}
  SAGA_API_TOKENS: ${SAGA_API_TOKENS}
  API_CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:-*}
  API_CORS_ALLOW_CREDENTIALS: ${API_CORS_ALLOW_CREDENTIALS:-true}
  OPENSEARCH_HOSTS: http://opensearch:9200
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-saga}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saga}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  REDIS_URL: redis://redis:6379/0
  DOCLING_URL: http://docling:5001
  KREUZBERG_URL: http://kreuzberg:8000
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-ollama}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  # Optional Ollama server fleet (least-busy distribution + failover).
  OLLAMA_URL_1: ${OLLAMA_URL_1:-}
  OLLAMA_URL_2: ${OLLAMA_URL_2:-}
  OLLAMA_URL_3: ${OLLAMA_URL_3:-}
  OLLAMA_URL_4: ${OLLAMA_URL_4:-}
  OLLAMA_MAX_CONCURRENT_1: ${OLLAMA_MAX_CONCURRENT_1:-}
  OLLAMA_MAX_CONCURRENT_2: ${OLLAMA_MAX_CONCURRENT_2:-}
  OLLAMA_MAX_CONCURRENT_3: ${OLLAMA_MAX_CONCURRENT_3:-}
  OLLAMA_MAX_CONCURRENT_4: ${OLLAMA_MAX_CONCURRENT_4:-}
  OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-5.0}
  OLLAMA_COOLDOWN_SECONDS: ${OLLAMA_COOLDOWN_SECONDS:-30}
  OLLAMA_STARTUP_MODEL_CHECK: ${OLLAMA_STARTUP_MODEL_CHECK:-true}
  OLLAMA_PULL_MISSING_MODELS: ${OLLAMA_PULL_MISSING_MODELS:-true}
  # Provider models / credentials (resolved by config/providers.yaml).
  OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
  OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
  AZURE_OPENAI_LLM_DEPLOYMENT: ${AZURE_OPENAI_LLM_DEPLOYMENT:-}
  AZURE_OPENAI_EMBED_DEPLOYMENT: ${AZURE_OPENAI_EMBED_DEPLOYMENT:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_RENDERER: ${LOG_RENDERER:-console}

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["saga-api"]
    environment: *app-env
    volumes: *prompts-mount
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["saga-worker"]
    environment: *app-env
    volumes: *prompts-mount
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["saga-mcp"]
    environment: *app-env
    volumes: *prompts-mount
    ports:
      - "${MCP_PORT:-8100}:8100"
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      # Required for mode=api (connect to external Ollama/vLLM endpoint).
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      # Required for mode=preset and mode=local (custom VLM config in request).
      DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG: "true"
      # HuggingFace cache location (used by mode=preset and mode=local).
      HF_HOME: /app/hf-cache
      TRANSFORMERS_CACHE: /app/hf-cache
    volumes:
      # Persist HuggingFace model downloads across container restarts.
      - hf-cache:/app/hf-cache
    ports:
      - "5001:5001"
    restart: unless-stopped

  kreuzberg:
    image: ghcr.io/kreuzberg-dev/kreuzberg:latest
    ports:
      - "8001:8000"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      # Dev only: disable the security plugin so the app can talk plain HTTP.
      # Enable security + TLS for production (see docs/operations).
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saga}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saga} -d ${POSTGRES_DB:-saga}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Pull models after first start, e.g.:
    #   docker compose exec ollama ollama pull llama3.1:8b
    #   docker compose exec ollama ollama pull nomic-embed-text
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  opensearch-data:
  postgres-data:
  minio-data:
  redis-data:
  ollama-data:
  hf-cache:       # HuggingFace model cache (docling-serve mode=preset / mode=local)
