# DocStore full stack (NFR-6). Brings up every component.
#
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up -d
#
# Image tags use `latest` to follow the "newest versions" requirement (NFR-4).
# At release time, tags are pinned for reproducibility (NFR-35, Phase 8).

name: docstore

x-app-env: &app-env
  DOCSTORE_ENV: ${DOCSTORE_ENV:-development}
  DOCSTORE_API_TOKENS: ${DOCSTORE_API_TOKENS}
  OPENSEARCH_HOSTS: http://opensearch:9200
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  REDIS_URL: redis://redis:6379/0
  DOCLING_URL: http://docling:5001
  KREUZBERG_URL: http://kreuzberg:8000
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-ollama}
  OLLAMA_URL: http://ollama:11434
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_RENDERER: ${LOG_RENDERER:-console}

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["docstore-api"]
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["docstore-worker"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["docstore-mcp"]
    environment: *app-env
    ports:
      - "${MCP_PORT:-8100}:8100"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"
    restart: unless-stopped

  kreuzberg:
    image: ghcr.io/kreuzberg-dev/kreuzberg:latest
    ports:
      - "8001:8000"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      # Dev only: disable the security plugin so the app can talk plain HTTP.
      # Enable security + TLS for production (see docs/operations).
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Pull models after first start, e.g.:
    #   docker compose exec ollama ollama pull llama3.1:8b
    #   docker compose exec ollama ollama pull nomic-embed-text
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  opensearch-data:
  minio-data:
  redis-data:
  ollama-data:
